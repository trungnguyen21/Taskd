syntax = "proto3";

package grpcapi;

option go_package = "github.com/JyotinderSingh/task-queue/pkg/grpcapi";

// The states a worker can report a run into. Terminal states other than these
// (missed, cancelled) are set by the platform, never by a worker.
enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUNNING = 1;
  SUCCEEDED = 2;
  FAILED = 3;
  BUDGET_EXCEEDED = 4;
}

// The worker service definition.
service WorkerService {
  // Offers a run to a worker. A worker that is saturated declines it, so the
  // coordinator can route elsewhere rather than stranding the run.
  rpc SubmitRun (RunRequest) returns (RunResponse) {}
}

// Dispatch carries a run identifier rather than an opaque command string: the
// worker reads everything else it needs from the database.
message RunRequest {
  string run_id = 1;
  string agent_id = 2;
}

message RunResponse {
  string run_id = 1;
  bool accepted = 2;
  string message = 3;
}

service CoordinatorService {
  // Sends a heartbeat to the coordinator.
  rpc SendHeartbeat (HeartbeatRequest) returns (HeartbeatResponse) {}
  // Reports the outcome of a run.
  rpc UpdateRunStatus (UpdateRunStatusRequest) returns (UpdateRunStatusResponse) {}
  // Extends the lease on a run that is still executing.
  rpc RenewLease (RenewLeaseRequest) returns (RenewLeaseResponse) {}
}

message HeartbeatRequest {
  uint32 workerId = 1;
  string address = 2;
}

message HeartbeatResponse {
  bool acknowledged = 1;
}

message UpdateRunStatusRequest {
  string run_id = 1;
  RunStatus status = 2;
  string output = 3;
  string error = 4;
  int32 prompt_tokens = 5;
  int32 completion_tokens = 6;
}

message UpdateRunStatusResponse {
  bool success = 1;
}

message RenewLeaseRequest {
  string run_id = 1;
}

message RenewLeaseResponse {
  bool success = 1;
}
