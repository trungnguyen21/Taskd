version: "3"
services:
  postgres:
    # The schema is owned by the application's migrations, which run on startup,
    # so the stock image is all that is needed here.
    image: postgres:16.1
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  scheduler:
    build:
      context: .
      dockerfile: scheduler-dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
    ports:
      - "8081:8081"
    depends_on:
      - postgres

  coordinator:
    build:
      context: .
      dockerfile: coordinator-dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  worker:
    build:
      context: .
      dockerfile: worker-dockerfile
    environment:
      WORKER_ADDRESS: worker
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      # The provider credential used for agent runs.
      TASKD_MODEL_API_KEY: ${TASKD_MODEL_API_KEY:-}
      # Lets agents fetch addresses on the local network. Off by default: a tool
      # that fetches arbitrary URLs from inside the deployment is otherwise an
      # SSRF engine pointed at your own network.
      TASKD_ALLOW_PRIVATE_FETCH: ${TASKD_ALLOW_PRIVATE_FETCH:-false}
    depends_on:
      - postgres
      - coordinator
