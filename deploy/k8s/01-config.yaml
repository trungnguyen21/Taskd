# Values every service reads. Nothing secret belongs here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskd-config
  namespace: taskd
data:
  POSTGRES_HOST: postgres
  POSTGRES_DB: taskd
  POSTGRES_USER: taskd
  # A tool that takes a URL from the model is an SSRF engine pointed at your own
  # network. Turn this on only if you want agents to reach your LAN.
  TASKD_ALLOW_PRIVATE_FETCH: "false"
---
# Create the real one before applying this, and do not commit it:
#
#   kubectl -n taskd create secret generic taskd-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=TASKD_SECRET_KEY="$(openssl rand -base64 32)" \
#     --from-literal=TASKD_PASSWORD="the dashboard password" \
#     --from-literal=TASKD_SEARCH_API_KEY=""
#
# TASKD_SECRET_KEY seals stored credentials. Losing it means losing every
# credential stored through the dashboard; changing it has the same effect.
apiVersion: v1
kind: Secret
metadata:
  name: taskd-secrets
  namespace: taskd
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  TASKD_SECRET_KEY: "change-me-to-32-random-bytes-base64"
  TASKD_PASSWORD: "change-me"
  TASKD_SEARCH_API_KEY: ""
